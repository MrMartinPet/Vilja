<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Växter provträning</title>

<style>
:root{
  --bg:#f4faf8;
  --card:#ffffff;
  --ink:#10231f;
  --muted:#5d6d68;
  --brand:#007766;
  --brand2:#0e9f8a;
  --soft:#dff4ef;
  --ok:#1b8f4d;
  --bad:#c83a3a;
  --line:#d7e5e1;
  --shadow:0 10px 30px rgba(0,50,43,.10);
  --radius:22px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.35;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:linear-gradient(135deg,var(--brand),#005f52);
  color:white;
  padding:18px 16px 16px;
  box-shadow:var(--shadow);
}

header h1{
  font-size:22px;
  margin:0 0 4px;
  font-weight:800;
}

header p{
  margin:0;
  font-size:14px;
  opacity:.9;
}

main{
  max-width:760px;
  margin:0 auto;
  padding:16px 14px 90px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin:12px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.cat{
  border:none;
  background:white;
  text-align:left;
  padding:16px;
  border-radius:20px;
  box-shadow:var(--shadow);
  border-left:8px solid var(--brand);
  min-height:92px;
  color:var(--ink);
}

.cat b{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.cat span{
  display:block;
  font-size:14px;
  color:var(--muted);
}

.small{
  font-size:13px;
  color:var(--muted);
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.btn{
  appearance:none;
  border:none;
  border-radius:16px;
  padding:13px 15px;
  background:var(--brand);
  color:white;
  font-weight:800;
  font-size:16px;
  box-shadow:0 6px 14px rgba(0,119,102,.2);
}

.btn.secondary{
  background:var(--soft);
  color:var(--brand);
  box-shadow:none;
}

.btn.ghost{
  background:white;
  color:var(--brand);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn:active{
  transform:scale(.98);
}

.hidden{
  display:none!important;
}

.pill{
  display:inline-block;
  background:var(--soft);
  color:var(--brand);
  font-weight:800;
  border-radius:999px;
  padding:6px 10px;
  font-size:13px;
}

.qtitle{
  font-size:22px;
  font-weight:850;
  margin:8px 0 10px;
}

.question{
  font-size:20px;
  font-weight:750;
  margin:8px 0 16px;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  background:white;
  border:2px solid var(--line);
  border-radius:18px;
  padding:14px;
  text-align:left;
  font-size:17px;
  color:var(--ink);
}

.option.correct{
  border-color:var(--ok);
  background:#e8f7ee;
}

.option.wrong{
  border-color:var(--bad);
  background:#fdecec;
}

.explain{
  margin-top:12px;
  padding:13px;
  border-radius:16px;
  background:#fff7e6;
  color:#442b00;
  font-size:15px;
}

.progress{
  height:12px;
  background:#dce9e5;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:.2s;
}

.flash{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:25px;
  font-weight:850;
  padding:22px;
  border-radius:24px;
  background:linear-gradient(135deg,#ffffff,#eaf8f5);
  border:1px solid var(--line);
}

.flash.answer{
  font-size:21px;
  font-weight:700;
  color:#163b34;
}

.modebar{
  position:sticky;
  bottom:0;
  background:rgba(244,250,248,.96);
  backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 12px;
  display:flex;
  gap:8px;
  justify-content:center;
}

.modebar .btn{
  font-size:14px;
  padding:11px 12px;
}

.matchGrid{
  display:grid;
  gap:10px;
}

.matchItem{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
}

.matchItem select{
  width:100%;
  margin-top:8px;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--line);
  font-size:16px;
  background:white;
}

.orderList{
  display:grid;
  gap:8px;
}

.orderItem{
  display:flex;
  gap:8px;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}

.orderItem span{
  flex:1;
}

.miniBtn{
  border:none;
  border-radius:10px;
  background:var(--soft);
  color:var(--brand);
  font-weight:900;
  padding:8px 10px;
}

.result{
  font-size:24px;
  font-weight:900;
}

@media(min-width:640px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .cat{
    min-height:118px;
  }

  header h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Växter provträning</h1>
  <p>Träna i sex delar. Kort, quiz, matchning och livscykel.</p>
</header>

<main>

<section id="home">
  <div class="card">
    <div class="row">
      <div>
        <b>Din träning</b>
        <div class="small">Bästa resultat sparas automatiskt på mobilen.</div>
      </div>
      <span class="pill" id="scorePill">0 rätt</span>
    </div>

    <div class="progress" style="margin-top:12px">
      <div class="bar" id="totalBar"></div>
    </div>
  </div>

  <div class="grid" id="catGrid"></div>

  <div class="card small">
    <b>Tips:</b> Kör först träningskort. Gör sedan quiz. Avsluta med blandat prov.
  </div>
</section>

<section id="category" class="hidden">
  <button class="btn ghost" onclick="showHome()">‹ Tillbaka</button>

  <div class="card">
    <span class="pill" id="catSub"></span>
    <div class="qtitle" id="catTitle"></div>
    <div id="catSummary" class="small"></div>
  </div>

  <div class="grid">
    <button class="cat" onclick="startFlash()">
      <b>Träningskort</b>
      <span>Vänd kort och repetera snabbt.</span>
    </button>

    <button class="cat" onclick="startQuiz()">
      <b>Quiz</b>
      <span>Få direkt svar och förklaring.</span>
    </button>

    <button class="cat" onclick="startSpecial()">
      <b>Specialövning</b>
      <span>Matcha eller lägg i rätt ordning.</span>
    </button>
  </div>
</section>

<section id="flash" class="hidden">
  <button class="btn ghost" onclick="openCategory(currentCat)">‹ Tillbaka</button>

  <div class="card">
    <div class="row">
      <span class="pill" id="flashCount"></span>
      <button class="btn secondary" onclick="flipFlash()">Vänd</button>
    </div>

    <div class="flash" id="flashCard"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn secondary" onclick="prevFlash()">Förra</button>
      <button class="btn" onclick="nextFlash()">Nästa</button>
    </div>
  </div>
</section>

<section id="quiz" class="hidden">
  <button class="btn ghost" onclick="openCategory(currentCat)">‹ Tillbaka</button>

  <div class="card">
    <div class="row">
      <span class="pill" id="quizCount"></span>
      <span class="pill" id="quizScore">0 rätt</span>
    </div>

    <div class="progress" style="margin:12px 0">
      <div class="bar" id="quizBar"></div>
    </div>

    <div class="question" id="qText"></div>
    <div class="options" id="options"></div>
    <div id="explain" class="explain hidden"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn secondary hidden" id="nextQ" onclick="nextQuestion()">Nästa</button>
    </div>
  </div>
</section>

<section id="special" class="hidden">
  <button class="btn ghost" onclick="openCategory(currentCat)">‹ Tillbaka</button>
  <div class="card" id="specialBox"></div>
</section>

<section id="mixed" class="hidden">
  <button class="btn ghost" onclick="showHome()">‹ Tillbaka</button>

  <div class="card">
    <div class="row">
      <span class="pill" id="mixCount"></span>
      <span class="pill" id="mixScore">0 rätt</span>
    </div>

    <div class="progress" style="margin:12px 0">
      <div class="bar" id="mixBar"></div>
    </div>

    <div class="question" id="mixText"></div>
    <div class="options" id="mixOptions"></div>
    <div id="mixExplain" class="explain hidden"></div>

    <button class="btn secondary hidden" id="mixNext" onclick="nextMixed()" style="margin-top:14px">
      Nästa
    </button>
  </div>
</section>

</main>

<div class="modebar">
  <button class="btn secondary" onclick="showHome()">Start</button>
  <button class="btn" onclick="startMixed()">Blandat prov</button>
  <button class="btn ghost" onclick="resetProgress()">Nollställ</button>
</div>

<script>
const cats = [
  {
    id:'historia',
    title:'Växthistoria',
    sub:'Sidor 20 till 21',
    summary:'Mossor kom först. Sedan ormbunksväxter, barrväxter och sist blomväxter.',
    cards:[
      ['Vilka var de första landväxterna?','Mossor. De lever gärna där det är fuktigt och förökar sig med sporer.'],
      ['Vad skiljer ormbunksväxter från mossor?','Ormbunksväxter är kärlväxter. De har tunna rör i stammen som leder vatten.'],
      ['Vad är speciellt med barrväxter?','De har kottar. I kottarna finns frön med skydd och näring.'],
      ['Vilken växtgrupp utvecklades sist?','Blomväxterna. De har stor variation och fröna finns i frukten.']
    ],
    questions:[
      ['Vilken växtgrupp kom först på land?',['Mossor','Barrväxter','Blomväxter','Lönnar'],0,'Mossor var de första landlevande växterna.'],
      ['Vad använder mossor för att föröka sig?',['Sporer','Kottar','Bär','Nektar'],0,'Mossor förökar sig med sporer.'],
      ['Vad finns i ormbunksväxters stammar?',['Tunna rör som leder vatten','Bär','Kottar','Frukt'],0,'De tunna rören gör dem till kärlväxter.'],
      ['Var finns blomväxters frön ofta?',['Inne i frukten','Bara i roten','I mossan','På stenen'],0,'Blomväxters frön finns inne i själva frukten.']
    ]
  },
  {
    id:'delar',
    title:'Växtens delar',
    sub:'Sidor 24 till 25',
    summary:'Blomma, blad, stjälk och rot har olika jobb.',
    cards:[
      ['Vad gör blomman?','Blomman gör nya frön och utvecklar frukt.'],
      ['Vad gör bladen?','Bladen tillverkar maten som växten behöver.'],
      ['Vad gör stjälken?','Den leder vatten och annat. Den ger också stöd.'],
      ['Vad gör roten?','Roten suger upp vatten och näring och håller växten på plats.']
    ],
    questions:[
      ['Vilken del gör nya frön?',['Blomman','Roten','Stjälken','Bladet'],0,'Blomman gör frön och kan utveckla frukt.'],
      ['Vilken del tillverkar växtens mat?',['Bladen','Rötterna','Fröna','Kottarna'],0,'Bladen tillverkar maten som växten behöver.'],
      ['Vilken del håller växten på plats?',['Roten','Blomman','Pollen','Nektar'],0,'Roten håller växten på plats och suger upp vatten.'],
      ['Vad gör stjälken?',['Ger stöd och leder vatten','Gör pollen','Äter bär','Sprider frön med vinden'],0,'Stjälken fungerar som stöd och transportväg.']
    ]
  },
  {
    id:'spridning',
    title:'Fröspridning',
    sub:'Sidor 40 till 41',
    summary:'Frön kan spridas med djur, vatten, vind, helikopterform eller av växten själv.',
    cards:[
      ['Hur sprids kardborre?','Den fastnar i djurs päls och lossnar senare.'],
      ['Hur sprids rönn?','Djur äter bären och bajsar ut fröna.'],
      ['Hur sprids al?','Alens kottar kan flyta iväg med vatten.'],
      ['Hur sprids maskros?','Fröna sprids med vinden.'],
      ['Hur sprids lönn?','Fröet snurrar som en helikopter.'],
      ['Hur sprids vallmo?','Kapseln spricker och sprutar iväg frön.']
    ],
    questions:[
      ['Vilken växt sprids med vinden?',['Maskros','Al','Rönn','Kardborre'],0,'Maskrosens frön kan flyga med vinden.'],
      ['Vilken växt fastnar i djurs päls?',['Kardborre','Vallmo','Lönn','Al'],0,'Kardborre sprids genom att fastna i päls.'],
      ['Vilken växt sprids genom att djur äter bären?',['Rönn','Maskros','Al','Vallmo'],0,'Rönnens bär äts av djur och fröna kommer ut senare.'],
      ['Vilken växt sprids som en helikopter?',['Lönn','Kardborre','Rönn','Vallmo'],0,'Lönnens frön snurrar när de faller.'],
      ['Vilken växt kan spridas med vatten?',['Al','Maskros','Solros','Vitsippa'],0,'Alens kottar kan flyta iväg med vatten.'],
      ['Vilken växt sprider sig själv med en kapsel?',['Vallmo','Lönn','Rönn','Kardborre'],0,'Vallmons kapsel kan spricka och spruta iväg frön.']
    ]
  },
  {
    id:'livscykel',
    title:'Växtens livscykel',
    sub:'Sidor 38 till 39',
    summary:'Frö, planta, blomma, pollinering, frukt, nya frön och spridning.',
    cards:[
      ['Steg 1 i bönans liv','Fröet ligger i jorden och gror.'],
      ['Steg 2','En liten planta växer upp med stjälk och blad.'],
      ['Steg 3','Blommor utvecklas med ståndare och pistill.'],
      ['Steg 4','Insekter hjälper till med pollinering.'],
      ['Steg 5','Frukt utvecklas.'],
      ['Steg 6','I frukten finns nya frön.'],
      ['Steg 7','Fröna sprids och nya växter kan uppstå.']
    ],
    questions:[
      ['Vad händer först i livscykeln?',['Fröet gror','Frukt utvecklas','Insekter pollinerar','Blomman vissnar'],0,'Först ligger fröet i jorden och gror.'],
      ['Vad växer efter att fröet gror?',['En liten planta','En färdig frukt','En kotte','Ett bär'],0,'En liten planta växer med stjälk och blad.'],
      ['Vad hjälper ofta till med pollinering?',['Insekter','Stenar','Regnmaskar','Rötter'],0,'Insekter kan flytta pollen mellan blommor.'],
      ['Vad finns i den färdiga frukten?',['Frön','Sporer','Nektar','Bara vatten'],0,'I den färdiga frukten finns frön.']
    ]
  },
  {
    id:'barn',
    title:'Hur växter får barn',
    sub:'Sidor 36 till 37',
    summary:'Pollen, pistill, ståndare, nektar och insekter hänger ihop vid pollinering och befruktning.',
    cards:[
      ['Vad är pollen?','Små korn från ståndaren som behövs för att bilda frön.'],
      ['Vad gör ståndaren?','Ståndaren bildar pollen.'],
      ['Vad gör pistillen?','Pistillen tar emot pollen. Där kan befruktning ske.'],
      ['Varför finns nektar?','Nektar lockar insekter till blomman.'],
      ['Hur hjälper insekter växter?','De flyttar pollen mellan blommor när de söker nektar.']
    ],
    questions:[
      ['Vilken del bildar pollen?',['Ståndare','Rot','Blad','Frukt'],0,'Ståndaren bildar pollen.'],
      ['Vilken del tar emot pollen?',['Pistill','Stjälk','Blad','Kardborre'],0,'Pistillen tar emot pollen.'],
      ['Vad lockar insekter till blomman?',['Nektar','Jord','Bark','Stenar'],0,'Nektar lockar insekter.'],
      ['Vad kan hända när pollen hamnar rätt?',['Befruktning','Växten vissnar direkt','Roten försvinner','Bladet blir en kotte'],0,'När pollen hamnar på pistillen kan befruktning ske.']
    ]
  },
  {
    id:'vanliga',
    title:'Vanliga blomväxter',
    sub:'Sidor 32 till 33',
    summary:'Känn igen några vanliga blomväxter och deras namn.',
    cards:[
      ['Exempel på vanlig blomväxt','Maskros. Gul blomma som ofta växer i gräsmattor.'],
      ['Exempel på vanlig blomväxt','Vitsippa. Vit blomma som ofta syns på våren.'],
      ['Exempel på vanlig blomväxt','Blåklocka. Blå eller lila klockformad blomma.'],
      ['Exempel på vanlig blomväxt','Solros. Stor gul blomma.'],
      ['Exempel på vanlig blomväxt','Smörblomma. Gul blomma med blanka kronblad.']
    ],
    questions:[
      ['Vilken blomma är ofta vit och vanlig på våren?',['Vitsippa','Solros','Maskros','Lönn'],0,'Vitsippan är en vanlig vårblomma.'],
      ['Vilken blomma är stor och gul?',['Solros','Blåklocka','Vitsippa','Al'],0,'Solrosen är stor och gul.'],
      ['Vilken blomma har ofta klockform?',['Blåklocka','Rönn','Kardborre','Vallmo'],0,'Blåklockan har klockformad blomma.'],
      ['Vilken gul blomma sprider frön med vinden?',['Maskros','Smörblomma','Solros','Vitsippa'],0,'Maskrosen sprider frön med vinden.']
    ]
  }
];

let currentCat = 'historia';
let flashIndex = 0;
let flipped = false;
let quiz = [];
let qi = 0;
let score = 0;
let mix = [];
let mi = 0;
let mixScore = 0;

const $ = id => document.getElementById(id);

function hideAll(){
  ['home','category','flash','quiz','special','mixed'].forEach(id => {
    $(id).classList.add('hidden');
  });
}

function showHome(){
  hideAll();
  $('home').classList.remove('hidden');
  renderHome();
}

function catById(id){
  return cats.find(c => c.id === id);
}

function renderHome(){
  const grid = $('catGrid');
  grid.innerHTML = '';

  cats.forEach(c => {
    let b = document.createElement('button');
    b.className = 'cat';
    b.innerHTML = `<b>${c.title}</b><span>${c.summary}</span>`;
    b.onclick = () => openCategory(c.id);
    grid.appendChild(b);
  });

  let best = Number(localStorage.vaxterBest || 0);
  $('scorePill').textContent = best + ' rätt bästa blandade prov';
  $('totalBar').style.width = Math.min(100,best * 10) + '%';
}

function openCategory(id){
  currentCat = id;
  let c = catById(id);

  hideAll();
  $('category').classList.remove('hidden');
  $('catTitle').textContent = c.title;
  $('catSub').textContent = c.sub;
  $('catSummary').textContent = c.summary;
}

function startFlash(){
  flashIndex = 0;
  flipped = false;

  hideAll();
  $('flash').classList.remove('hidden');
  renderFlash();
}

function renderFlash(){
  let c = catById(currentCat);
  let card = c.cards[flashIndex];

  $('flashCount').textContent = (flashIndex + 1) + ' av ' + c.cards.length;
  $('flashCard').className = 'flash' + (flipped ? ' answer' : '');
  $('flashCard').textContent = flipped ? card[1] : card[0];
}

function flipFlash(){
  flipped = !flipped;
  renderFlash();
}

function nextFlash(){
  let c = catById(currentCat);
  flashIndex = (flashIndex + 1) % c.cards.length;
  flipped = false;
  renderFlash();
}

function prevFlash(){
  let c = catById(currentCat);
  flashIndex = (flashIndex - 1 + c.cards.length) % c.cards.length;
  flipped = false;
  renderFlash();
}

function shuffle(a){
  return [...a].sort(() => Math.random() - .5);
}

function prepQuestions(qs){
  return shuffle(qs).map(q => ({
    t:q[0],
    ops:q[1],
    a:q[2],
    e:q[3]
  }));
}

function startQuiz(){
  quiz = prepQuestions(catById(currentCat).questions);
  qi = 0;
  score = 0;

  hideAll();
  $('quiz').classList.remove('hidden');
  renderQ();
}

function renderQ(){
  let q = quiz[qi];

  $('quizCount').textContent = (qi + 1) + ' av ' + quiz.length;
  $('quizScore').textContent = score + ' rätt';
  $('quizBar').style.width = (qi / quiz.length * 100) + '%';
  $('qText').textContent = q.t;
  $('explain').classList.add('hidden');
  $('nextQ').classList.add('hidden');

  let ops = $('options');
  ops.innerHTML = '';

  q.ops.forEach((op,i) => {
    let btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = op;
    btn.onclick = () => answer(i);
    ops.appendChild(btn);
  });
}

function answer(i){
  let q = quiz[qi];

  Array.from($('options').children).forEach((b,idx) => {
    b.disabled = true;

    if(idx === q.a){
      b.classList.add('correct');
    }

    if(idx === i && i !== q.a){
      b.classList.add('wrong');
    }
  });

  if(i === q.a){
    score++;
  }

  $('quizScore').textContent = score + ' rätt';
  $('explain').textContent = q.e;
  $('explain').classList.remove('hidden');
  $('nextQ').classList.remove('hidden');
}

function nextQuestion(){
  qi++;

  if(qi >= quiz.length){
    $('qText').innerHTML = `<span class="result">Klart: ${score} av ${quiz.length}</span>`;
    $('options').innerHTML = '';
    $('explain').classList.add('hidden');
    $('nextQ').classList.add('hidden');
    $('quizBar').style.width = '100%';
    return;
  }

  renderQ();
}

function startMixed(){
  mix = prepQuestions(cats.flatMap(c => c.questions)).slice(0,10);
  mi = 0;
  mixScore = 0;

  hideAll();
  $('mixed').classList.remove('hidden');
  renderMixed();
}

function renderMixed(){
  let q = mix[mi];

  $('mixCount').textContent = (mi + 1) + ' av ' + mix.length;
  $('mixScore').textContent = mixScore + ' rätt';
  $('mixBar').style.width = (mi / mix.length * 100) + '%';
  $('mixText').textContent = q.t;
  $('mixExplain').classList.add('hidden');
  $('mixNext').classList.add('hidden');

  let box = $('mixOptions');
  box.innerHTML = '';

  q.ops.forEach((op,i) => {
    let btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = op;
    btn.onclick = () => answerMixed(i);
    box.appendChild(btn);
  });
}

function answerMixed(i){
  let q = mix[mi];

  Array.from($('mixOptions').children).forEach((b,idx) => {
    b.disabled = true;

    if(idx === q.a){
      b.classList.add('correct');
    }

    if(idx === i && i !== q.a){
      b.classList.add('wrong');
    }
  });

  if(i === q.a){
    mixScore++;
  }

  $('mixScore').textContent = mixScore + ' rätt';
  $('mixExplain').textContent = q.e;
  $('mixExplain').classList.remove('hidden');
  $('mixNext').classList.remove('hidden');
}

function nextMixed(){
  mi++;

  if(mi >= mix.length){
    $('mixText').innerHTML = `<span class="result">Resultat: ${mixScore} av ${mix.length}</span>`;
    $('mixOptions').innerHTML = '';
    $('mixExplain').classList.add('hidden');
    $('mixNext').classList.add('hidden');
    $('mixBar').style.width = '100%';

    let best = Math.max(Number(localStorage.vaxterBest || 0), mixScore);
    localStorage.vaxterBest = best;
    return;
  }

  renderMixed();
}

function startSpecial(){
  hideAll();
  $('special').classList.remove('hidden');

  let c = catById(currentCat);

  if(c.id === 'livscykel'){
    orderExercise();
  }else{
    matchExercise(c);
  }
}

function matchExercise(c){
  let pairs = [];

  if(c.id === 'delar'){
    pairs = [
      ['Blomma','Gör frön och frukt'],
      ['Blad','Tillverkar mat'],
      ['Stjälk','Leder vatten och ger stöd'],
      ['Rot','Suger upp vatten och håller fast växten']
    ];
  }else if(c.id === 'spridning'){
    pairs = [
      ['Kardborre','Fastnar i päls'],
      ['Rönn','Djur äter bären'],
      ['Al','Flyter med vatten'],
      ['Maskros','Flyger med vinden'],
      ['Lönn','Snurrar som helikopter'],
      ['Vallmo','Kapsel spricker och sprutar frön']
    ];
  }else if(c.id === 'barn'){
    pairs = [
      ['Ståndare','Bildar pollen'],
      ['Pistill','Tar emot pollen'],
      ['Nektar','Lockar insekter'],
      ['Insekt','Flyttar pollen'],
      ['Befruktning','Kan leda till frön']
    ];
  }else if(c.id === 'historia'){
    pairs = [
      ['Mossa','Första landväxten, sporer'],
      ['Ormbunksväxt','Kärlväxt med rör'],
      ['Barrväxt','Kottar med frön'],
      ['Blomväxt','Frön inne i frukt']
    ];
  }else{
    pairs = [
      ['Maskros','Gul blomma, frön med vind'],
      ['Vitsippa','Vit vårblomma'],
      ['Blåklocka','Klockformad blomma'],
      ['Solros','Stor gul blomma'],
      ['Smörblomma','Gul med blanka kronblad']
    ];
  }

  let answers = shuffle(pairs.map(p => p[1]));

  $('specialBox').innerHTML = `
    <div class="qtitle">Matcha rätt</div>

    <div class="matchGrid">
      ${pairs.map((p,i) => `
        <div class="matchItem">
          <b>${p[0]}</b>
          <select id="m${i}">
            <option value="">Välj svar</option>
            ${answers.map(a => `<option>${a}</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>

    <button class="btn" style="margin-top:14px" onclick='checkMatch(${JSON.stringify(pairs)})'>
      Rätta
    </button>

    <div id="specialResult" class="explain hidden"></div>
  `;
}

function checkMatch(pairs){
  let r = 0;

  pairs.forEach((p,i) => {
    if($('m' + i).value === p[1]){
      r++;
    }
  });

  $('specialResult').classList.remove('hidden');
  $('specialResult').innerHTML = `Du fick <b>${r} av ${pairs.length}</b> rätt.`;
}

function orderExercise(){
  let correct = [
    'Frö i jorden. Fröet gror.',
    'Liten planta växer med stjälk och blad.',
    'Blommor utvecklas med ståndare och pistill.',
    'Insekter hjälper till med pollinering.',
    'Frukt utvecklas.',
    'I frukten finns frön.',
    'Frön sprids och nya växter kan uppstå.'
  ];

  let arr = shuffle(correct);
  window.orderArr = arr;

  renderOrder(correct);
}

function renderOrder(correct){
  $('specialBox').innerHTML = `
    <div class="qtitle">Lägg livscykeln i rätt ordning</div>

    <div class="orderList">
      ${orderArr.map((t,i) => `
        <div class="orderItem">
          <button class="miniBtn" onclick="moveOrder(${i},-1)">↑</button>
          <button class="miniBtn" onclick="moveOrder(${i},1)">↓</button>
          <span>${t}</span>
        </div>
      `).join('')}
    </div>

    <button class="btn" style="margin-top:14px" onclick='checkOrder(${JSON.stringify(correct)})'>
      Rätta
    </button>

    <div id="specialResult" class="explain hidden"></div>
  `;
}

function moveOrder(i,d){
  let ni = i + d;

  if(ni < 0 || ni >= orderArr.length){
    return;
  }

  [orderArr[i], orderArr[ni]] = [orderArr[ni], orderArr[i]];

  let correct = [
    'Frö i jorden. Fröet gror.',
    'Liten planta växer med stjälk och blad.',
    'Blommor utvecklas med ståndare och pistill.',
    'Insekter hjälper till med pollinering.',
    'Frukt utvecklas.',
    'I frukten finns frön.',
    'Frön sprids och nya växter kan uppstå.'
  ];

  renderOrder(correct);
}

function checkOrder(correct){
  let r = orderArr.filter((x,i) => x === correct[i]).length;

  $('specialResult').classList.remove('hidden');
  $('specialResult').innerHTML = `Du fick <b>${r} av ${correct.length}</b> på rätt plats.`;
}

function resetProgress(){
  localStorage.removeItem('vaxterBest');
  renderHome();
}

renderHome();
</script>
