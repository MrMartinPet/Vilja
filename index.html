<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Viljas läxa – 8 ord</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#fff;
      --text:#172033;
      --muted:#667085;
      --blue:#2563eb;
      --blue2:#dbeafe;
      --green:#16803d;
      --green2:#dcfce7;
      --red:#b42318;
      --red2:#fee4e2;
      --border:#d9e2ef;
      --shadow:0 16px 38px rgba(23,32,51,.12);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{min-height:100dvh}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    .app{max-width:560px;min-height:100dvh;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
    header{padding:8px 4px 2px}
    h1{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.035em}
    .sub{margin:7px 0 0;color:var(--muted);font-weight:650}
    .screen{display:none;flex:1}
    .screen.active{display:flex;flex-direction:column}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    .home{justify-content:center;gap:12px}
    .homeBtn{width:100%;min-height:118px;border-radius:24px;padding:20px;text-align:left;color:white;background:var(--blue);box-shadow:var(--shadow)}
    .homeBtn.secondary{background:#172033}
    .homeBtn strong{display:block;font-size:24px;margin-bottom:6px}
    .homeBtn span{font-size:15px;opacity:.9;font-weight:650}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .backBtn{background:#e9eef5;color:var(--text);border-radius:14px;padding:10px 13px;font-weight:850}
    .counter{color:var(--muted);font-weight:800;font-size:14px}
    .progress{height:9px;background:#e7edf5;border-radius:999px;overflow:hidden;margin-bottom:12px}
    .progress>div{height:100%;background:var(--blue);width:0;transition:width .2s}
    .flashWrap{perspective:1000px;flex:1;min-height:330px}
    .flash{position:relative;width:100%;height:100%;min-height:330px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
    .flash.flipped{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:var(--card)}
    .face.back{transform:rotateY(180deg);background:linear-gradient(180deg,#eff6ff,#fff)}
    .word{font-size:42px;font-weight:950;letter-spacing:-.04em;overflow-wrap:anywhere}
    .definition{font-size:24px;line-height:1.35;font-weight:800}
    .hint{position:absolute;bottom:18px;left:0;right:0;color:var(--muted);font-weight:700;font-size:13px}
    .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .btn{min-height:52px;border-radius:16px;padding:12px 14px;font-weight:900;background:var(--blue);color:#fff}
    .btn.light{background:#e9eef5;color:var(--text)}
    .spellPanel{display:flex;flex-direction:column;gap:14px;min-height:430px}
    .speaker{width:116px;height:116px;border-radius:50%;margin:16px auto 4px;background:var(--blue);color:white;font-size:48px;box-shadow:var(--shadow)}
    .listen{text-align:center;font-size:18px;font-weight:800}
    .spellInput{width:100%;border:2px solid var(--border);border-radius:16px;padding:15px 16px;font-size:24px;text-align:center;font-weight:800;outline:none;background:#fff}
    .spellInput:focus{border-color:var(--blue)}
    .result{min-height:70px;border-radius:18px;padding:14px;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:850}
    .result.good{display:flex;background:var(--green2);color:var(--green)}
    .result.bad{display:flex;background:var(--red2);color:var(--red)}
    .spellActions{display:grid;grid-template-columns:1fr;gap:10px}
    .scoreBox{text-align:center;margin:auto 0;padding:18px 10px}
    .scoreBig{font-size:64px;font-weight:950;letter-spacing:-.05em}
    .scoreText{font-size:19px;font-weight:800;color:var(--muted);margin-bottom:20px}
    .tiny{text-align:center;color:var(--muted);font-size:13px;font-weight:650;margin-top:8px}
    @media(max-width:380px){
      .app{padding:10px}
      h1{font-size:27px}
      .word{font-size:35px}
      .definition{font-size:21px}
      .flashWrap,.flash{min-height:300px}
      .speaker{width:100px;height:100px;font-size:42px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Viljas läxa</h1>
      <p class="sub">8 ord att kunna förklara och stava</p>
    </header>

    <main id="home" class="screen active home">
      <button class="homeBtn" id="flashStart">
        <strong>🧠 Flashcards</strong>
        <span>Se ordet, tryck på kortet och läs förklaringen.</span>
      </button>
      <button class="homeBtn secondary" id="spellStart">
        <strong>🔊 Stava orden</strong>
        <span>Lyssna på ordet och skriv hur det stavas.</span>
      </button>
    </main>

    <main id="flashScreen" class="screen">
      <div class="panel" style="display:flex;flex-direction:column;flex:1">
        <div class="toprow">
          <button class="backBtn" data-home>← Meny</button>
          <div class="counter" id="flashCounter"></div>
        </div>
        <div class="progress"><div id="flashProgress"></div></div>
        <div class="flashWrap">
          <div class="flash" id="flashCard" role="button" tabindex="0" aria-label="Vänd kortet">
            <div class="face front">
              <div class="word" id="flashWord"></div>
              <div class="hint">Tryck för förklaring</div>
            </div>
            <div class="face back">
              <div class="definition" id="flashDefinition"></div>
              <div class="hint">Tryck för att vända tillbaka</div>
            </div>
          </div>
        </div>
        <div class="nav">
          <button class="btn light" id="prevCard">← Förra</button>
          <button class="btn" id="nextCard">Nästa →</button>
        </div>
      </div>
    </main>

    <main id="spellScreen" class="screen">
      <div class="panel spellPanel">
        <div class="toprow">
          <button class="backBtn" data-home>← Meny</button>
          <div class="counter" id="spellCounter"></div>
        </div>
        <div class="progress"><div id="spellProgress"></div></div>

        <div id="spellPlay">
          <button class="speaker" id="speakBtn" aria-label="Lyssna på ordet">🔊</button>
          <div class="listen">Tryck på högtalaren och skriv ordet.</div>
          <input id="spellInput" class="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" aria-label="Skriv ordet">
          <div id="spellResult" class="result"></div>
          <div class="spellActions" style="margin-top:12px">
            <button class="btn" id="checkSpell">Kolla svaret</button>
            <button class="btn light" id="nextSpell" style="display:none">Nästa ord →</button>
          </div>
          <div class="tiny">Du får höra ordet hur många gånger du vill.</div>
        </div>

        <div id="spellDone" class="scoreBox" style="display:none">
          <div class="scoreBig" id="scoreBig"></div>
          <div class="scoreText" id="scoreText"></div>
          <button class="btn" id="restartSpell">Kör igen</button>
        </div>
      </div>
    </main>
  </div>

<script>
const words = [
  { word: "Skorpion", definition: "Ett litet djur med åtta ben, två klor och en böjd svans som kan sticka med gift." },
  { word: "Regnskog", definition: "En varm och mycket fuktig skog där det regnar mycket och där många olika växter och djur lever." },
  { word: "Kamouflage", definition: "Färger, mönster eller former som gör att ett djur eller en person blir svårare att upptäcka i sin omgivning." },
  { word: "Anpassa", definition: "Att förändra något så att det passar bättre till en viss situation eller miljö." },
  { word: "Demokrati", definition: "Ett sätt att styra ett land där folket får vara med och bestämma, bland annat genom fria val." },
  { word: "Diktatur", definition: "Ett sätt att styra ett land där en person eller en liten grupp har nästan all makt och folket har liten möjlighet att påverka." },
  { word: "Yttrandefrihet", definition: "Rätten att säga och uttrycka vad man tycker, så länge man följer lagen och inte hotar andra." },
  { word: "Rösträtt", definition: "Rätten att vara med och välja vilka personer eller partier som ska bestämma i till exempel ett land." }
];

const screens = [...document.querySelectorAll('.screen')];
function showScreen(id){
  screens.forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => showScreen('home')));

let flashIndex = 0;
const flashCard = document.getElementById('flashCard');
function renderFlash(){
  const item = words[flashIndex];
  flashCard.classList.remove('flipped');
  document.getElementById('flashWord').textContent = item.word;
  document.getElementById('flashDefinition').textContent = item.definition;
  document.getElementById('flashCounter').textContent = `${flashIndex + 1} av ${words.length}`;
  document.getElementById('flashProgress').style.width = `${((flashIndex + 1) / words.length) * 100}%`;
}
function flipFlash(){ flashCard.classList.toggle('flipped'); }
flashCard.addEventListener('click', flipFlash);
flashCard.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flipFlash(); }});
document.getElementById('flashStart').addEventListener('click', () => { flashIndex = 0; renderFlash(); showScreen('flashScreen'); });
document.getElementById('prevCard').addEventListener('click', () => { flashIndex = (flashIndex - 1 + words.length) % words.length; renderFlash(); });
document.getElementById('nextCard').addEventListener('click', () => { flashIndex = (flashIndex + 1) % words.length; renderFlash(); });

let spellOrder = [];
let spellIndex = 0;
let score = 0;
let answered = false;
const spellInput = document.getElementById('spellInput');
const spellResult = document.getElementById('spellResult');
const checkSpell = document.getElementById('checkSpell');
const nextSpell = document.getElementById('nextSpell');

function shuffle(array){
  const a = [...array];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalize(s){ return s.trim().toLocaleLowerCase('sv-SE').normalize('NFC'); }
function currentSpell(){ return spellOrder[spellIndex]; }

function speakCurrent(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentSpell().word);
  u.lang = 'sv-SE';
  u.rate = 0.82;
  const voices = speechSynthesis.getVoices();
  const sv = voices.find(v => /^sv[-_]/i.test(v.lang));
  if(sv) u.voice = sv;
  speechSynthesis.speak(u);
}

function renderSpell(){
  answered = false;
  spellInput.value = '';
  spellInput.disabled = false;
  spellResult.className = 'result';
  spellResult.textContent = '';
  checkSpell.style.display = '';
  nextSpell.style.display = 'none';
  document.getElementById('spellCounter').textContent = `${spellIndex + 1} av ${words.length}`;
  document.getElementById('spellProgress').style.width = `${((spellIndex + 1) / words.length) * 100}%`;
  spellInput.focus({preventScroll:true});
}

function startSpelling(){
  spellOrder = shuffle(words);
  spellIndex = 0;
  score = 0;
  document.getElementById('spellPlay').style.display = '';
  document.getElementById('spellDone').style.display = 'none';
  showScreen('spellScreen');
  renderSpell();
  setTimeout(speakCurrent, 120);
}

document.getElementById('spellStart').addEventListener('click', startSpelling);
document.getElementById('restartSpell').addEventListener('click', startSpelling);
document.getElementById('speakBtn').addEventListener('click', speakCurrent);

function checkAnswer(){
  if(answered) return;
  const typed = normalize(spellInput.value);
  if(!typed){
    spellInput.focus();
    return;
  }
  answered = true;
  const correctWord = currentSpell().word;
  const isCorrect = typed === normalize(correctWord);
  if(isCorrect){
    score++;
    spellResult.className = 'result good';
    spellResult.textContent = '✓ Rätt!';
  }else{
    spellResult.className = 'result bad';
    spellResult.innerHTML = `Inte riktigt. Rätt stavning är <strong style="margin-left:5px">${correctWord}</strong>.`;
  }
  spellInput.disabled = true;
  checkSpell.style.display = 'none';
  nextSpell.style.display = '';
  nextSpell.textContent = spellIndex === words.length - 1 ? 'Visa resultat' : 'Nästa ord →';
}

checkSpell.addEventListener('click', checkAnswer);
spellInput.addEventListener('keydown', e => { if(e.key === 'Enter') checkAnswer(); });
nextSpell.addEventListener('click', () => {
  if(spellIndex < words.length - 1){
    spellIndex++;
    renderSpell();
    setTimeout(speakCurrent, 100);
  }else{
    document.getElementById('spellPlay').style.display = 'none';
    document.getElementById('spellDone').style.display = '';
    document.getElementById('scoreBig').textContent = `${score}/${words.length}`;
    document.getElementById('scoreText').textContent = score === words.length ? 'Alla rätt – snyggt!' : score >= 6 ? 'Nästan allt satt. Kör en gång till!' : 'Bra träning. Kör en runda till!';
    document.getElementById('spellCounter').textContent = 'Klart';
    document.getElementById('spellProgress').style.width = '100%';
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
