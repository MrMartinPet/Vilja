<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc">
<title>Klockan · Viljas läxa</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="../manifest.json">
<script defer src="time.js"></script><script defer src="game.js?v=clock-drag-20261108"></script>
</head>
<body>
<main class="app">
<header><a href="../" class="back" aria-label="Till Viljas läxa">←</a><nav aria-label="Välj läge"><button id="practiceTab" aria-pressed="true" class="active">Träna</button><button id="exploreTab" aria-pressed="false">Utforska</button></nav><button id="settingsButton" class="icon" aria-label="Inställningar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M9 3v6M15 9v6M9 15v6" stroke-width="3"/></svg></button></header>
<section id="play" class="workspace">
<div class="prompt"><span id="counter"></span><h1 id="question" tabindex="-1"></h1><p id="context"></p></div>
<div class="clock-area"><svg id="clock" viewBox="0 0 360 360" aria-label="Analog klocka" role="group">
<circle cx="180" cy="180" r="173" class="clock-rim"/><circle cx="180" cy="180" r="156" fill="white"/>
<g id="ticks" aria-hidden="true"></g><g id="numbers" aria-hidden="true"></g><g id="minuteNumbers" aria-hidden="true"></g>
<g id="solution" hidden opacity=".3"><line id="ghostHour" x1="180" y1="180" x2="180" y2="98" stroke="#14a676" stroke-width="11" stroke-linecap="round"/><line id="ghostMinute" x1="180" y1="180" x2="180" y2="56" stroke="#14a676" stroke-width="7" stroke-linecap="round"/></g>
<g id="hourHand" class="hand" tabindex="0" role="slider" aria-label="Timvisare" aria-valuemin="0" aria-valuemax="1439"><line x1="180" y1="193" x2="180" y2="98" class="hour-line"/><circle cx="180" cy="98" r="12" class="hour-grip"/><line x1="180" y1="175" x2="180" y2="93" class="hit"/></g>
<g id="minuteHand" class="hand" tabindex="0" role="slider" aria-label="Minutvisare" aria-valuemin="0" aria-valuemax="1439"><line x1="180" y1="196" x2="180" y2="56" class="minute-line"/><circle cx="180" cy="56" r="11" class="minute-grip"/><line x1="180" y1="165" x2="180" y2="50" class="hit"/></g>
<circle cx="180" cy="180" r="10" fill="#24314d"/><circle cx="180" cy="180" r="4" fill="white"/>
</svg></div>
<div class="below-clock">
<div id="live" hidden><strong id="liveTime"></strong><span id="liveWords"></span></div>
<div id="periodControl" class="period-control" role="group" aria-label="Välj halva av dygnet"><button id="morning" aria-pressed="true">00–11</button><button id="evening" aria-pressed="false">12–23</button></div>
<form id="answerForm" hidden><label class="sr-only" for="hours">Skriv digital tid</label><input id="hours" inputmode="numeric" maxlength="2" placeholder="TT" aria-label="Timmar, 00 till 23" autocomplete="off"><span>:</span><input id="minutes" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Minuter, 00 till 59" autocomplete="off"></form>
</div>
<div class="bottom"><p id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="hint" class="secondary">Ledtråd</button><button id="check" class="primary">Kolla svaret</button><button id="next" class="primary" hidden>Nästa →</button></div><p id="instruction">Dra i visarna för att ställa klockan.</p></div>
</section>
<section id="summary" hidden><h1>Bra jobbat!</h1><p id="resultText"></p><button id="again" class="primary">Spela igen</button><button id="retry" class="secondary">Öva på det svåra</button></section>
</main>
<dialog id="settings"><form method="dialog"><div class="dialog-heading"><h2>Din träning</h2><button aria-label="Stäng inställningar" class="icon" value="cancel">×</button></div><label>Övning<select id="mode"><option value="mix">Ställ klockan · siffror och ord</option><option value="set">Ställ klockan · siffror</option><option value="words">Ställ klockan · ord</option><option value="read">Läs klockan · skriv tiden</option></select></label><label>Nivå<select id="level"><option value="0">Hela och halva timmar</option><option value="1">Kvart i och kvart över</option><option value="2" selected>Fem minuter i taget</option><option value="3">Alla minuter</option></select></label><label class="checkbox"><input id="showMinutes" type="checkbox"> Visa minutstöd</label><button class="primary" id="apply" value="apply">Klart</button></form></dialog>
</body></html>
