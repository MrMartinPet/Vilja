<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554"><title>Stjärnjakten · Mattespel</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:#101d46;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 85% 10%,#534b94 0,transparent 45%),radial-gradient(ellipse at 10% 80%,#17667b 0,transparent 50%),#101d46}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:disabled{cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #fde68a;outline-offset:5px}[hidden]{display:none!important}.app{max-width:640px;margin:auto;padding:20px 16px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}a{color:#fff;text-decoration:none;background:#ffffff14;padding:12px 16px;border:1px solid #ffffff30;border-radius:16px;font-weight:750}.tag{color:#d6dcf9;font-size:14px}.hero{text-align:center}.rocket{font-size:70px;display:block;margin:10px}.eyebrow{color:#a5f3fc;font-size:13px;letter-spacing:.14em;font-weight:850;text-transform:uppercase}h1{font-size:clamp(36px,8vw,54px);margin:6px 0;letter-spacing:-.04em}p{color:#dce5ff;line-height:1.5;margin:12px 0 22px}.card{background:#ffffff0e;border:1px solid #ffffff26;border-radius:28px;padding:24px;box-shadow:0 24px 60px #0002}.levels{display:grid;gap:12px}.level{padding:18px 20px;background:#f0f5ff;color:#152345;border-radius:20px;text-align:left;display:flex;align-items:center;gap:16px;min-height:84px}.level i{font-size:32px;font-style:normal}.level strong{font-size:21px;display:block}.level small{font-size:14px;display:block;margin-top:4px;color:#465775}.record{text-align:center;font-size:14px;color:#dce5ff;margin:22px 0 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.quiet{padding:11px 14px;border-radius:14px;background:#ffffff16;color:#fff;font-weight:750}.stars{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:24px 0;font-size:clamp(20px,5vw,30px)}.star{color:#65709c}.star.won{color:#fde68a;text-shadow:0 0 18px #facc1580}.planet{text-align:center;font-size:52px}.question{text-align:center;font-size:clamp(42px,12vw,66px);font-weight:900;letter-spacing:-.03em;margin:16px 0 24px;font-variant-numeric:tabular-nums}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{background:#eef4ff;color:#14254a;border-radius:20px;min-height:90px;font-size:36px;font-weight:900;box-shadow:0 5px 0 #97a9d0}.answer:active{transform:translateY(3px);box-shadow:0 2px 0 #97a9d0}.answer.correct{background:#a7f3d0;box-shadow:0 5px 0 #34d399}.answer.wrong{background:#ddd9f2;color:#5b4b77;box-shadow:0 5px 0 #a9a0c5}.feedback{min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:750;line-height:1.4;padding:16px 0}.action{width:100%;background:#fde68a;color:#302617;border-radius:18px;min-height:60px;font-weight:900;font-size:19px}.helpBtn{display:block;margin:18px auto 0;background:transparent;color:#e0e7ff;text-decoration:underline;text-underline-offset:4px;padding:10px}.help{margin:16px 0;background:#0c193555;padding:16px;border-radius:18px}.help p{margin:0 0 12px;font-size:15px}.frames{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.frame{display:grid;grid-template-columns:repeat(5,22px);gap:5px;padding:8px;background:#ffffff0e;border-radius:12px}.dot{width:22px;height:22px;border-radius:50%;background:#ffffff15;border:1px solid #ffffff20}.dot.first{background:#67e8f9}.dot.second{background:#f9a8d4}.legend{text-align:center;font-weight:800;margin-bottom:12px}.legend .cyan{color:#67e8f9}.legend .pink{color:#f9a8d4}.finish{text-align:center}.finish h2{font-size:34px;margin:10px 0}.trophy{font-size:84px}.finish .action{margin-top:12px}.finish .quiet{width:100%;margin-top:12px;min-height:54px}.pop{animation:pop .4s ease-out}@keyframes pop{50%{transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.pop{animation:none}}@media(max-width:380px){.app{padding:12px}.card{padding:18px}.answer{min-height:78px}.tag{font-size:12px}}
</style>
</head>
<body><div class="app">
<header><a href="./index.html">← Viljas app</a><span class="tag">Addition · cirka 7 år</span></header>
<main>
<section id="setup">
<div class="hero"><span class="rocket" aria-hidden="true">🚀</span><div class="eyebrow">Ett litet matteäventyr</div><h1>Stjärnjakten</h1><p>Räkna plus och samla 10 stjärnor.<br>Ta den tid du behöver!</p></div>
<div class="card"><div class="levels">
<button class="level" data-level="easy"><i aria-hidden="true">🌍</i><span><strong>Starta lugnt</strong><small>Små tal · svar upp till 10</small></span></button>
<button class="level" data-level="mixed"><i aria-hidden="true">🪐</i><span><strong>Rymdäventyr</strong><small>Blandade tal · högst 9 + 9</small></span></button>
<button class="level" data-level="doubles"><i aria-hidden="true">🌟</i><span><strong>Dubbelstjärnor</strong><small>Öva 1 + 1 till 9 + 9</small></span></button>
</div><div id="record" class="record"></div></div>
</section>
<section id="play" hidden>
<div class="top"><button id="menu" class="quiet">← Byt nivå</button><span id="counter" class="tag"></span></div>
<div id="stars" class="stars" aria-label="Insamlade stjärnor"></div>
<div class="card"><div class="planet" aria-hidden="true">🚀</div><div id="question" class="question"></div>
<div id="answers" class="answers" role="group" aria-label="Välj ditt svar"></div>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<button id="next" class="action" hidden>Nästa stjärna →</button>
<button id="helpBtn" class="helpBtn" aria-expanded="false" aria-controls="help">💡 Hjälp mig räkna</button>
<div id="help" class="help" hidden><div id="legend" class="legend"></div><p id="tip"></p><div id="frames" class="frames" aria-hidden="true"></div></div>
</div></section>
<section id="done" class="card finish" hidden><div class="trophy" aria-hidden="true">🏆</div><div class="eyebrow">Uppdrag slutfört</div><h2>Du hittade alla stjärnor!</h2><p id="summary"></p><div class="stars" aria-label="10 stjärnor">⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐</div><button id="again" class="action">Spela igen 🚀</button><button id="levels" class="quiet">Välj en annan nivå</button></section>
</main></div><script src="mattespel.js"></script></body></html>
