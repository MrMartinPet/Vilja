<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viljas Fotosyntes</title>

  <style>
    :root{
      --bg:#eef4f8;
      --card:#ffffff;
      --text:#132033;
      --muted:#667085;
      --blue:#156082;
      --blueLight:#e7f3f7;
      --green:#21803f;
      --yellow:#f6c453;
      --red:#b42318;
      --border:#d9e2ea;
      --shadow:0 12px 28px rgba(20,32,51,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(180deg,#dff0f6 0%,var(--bg) 48%);
      color:var(--text);
    }

    .app{
      height:100dvh;
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:10px;
    }

    header{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .badge{
      background:var(--blueLight);
      color:var(--blue);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }

    .small{
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    h1{
      margin:0;
      font-size:27px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    h2{
      margin:0 0 8px;
      font-size:24px;
      letter-spacing:-.02em;
    }

    p{
      margin:6px 0;
      line-height:1.35;
    }

    .screen{
      display:none;
      flex:1 1 auto;
      min-height:0;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen.active{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menuGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      overflow:auto;
      padding-bottom:2px;
    }

    button{
      border:0;
      border-radius:18px;
      padding:13px 14px;
      font-size:15px;
      font-weight:850;
      background:var(--blue);
      color:white;
      cursor:pointer;
      min-height:48px;
    }

    button.secondary{
      background:#eef2f6;
      color:var(--text);
      border:1px solid var(--border);
    }

    button.green{
      background:var(--green);
    }

    button.yellow{
      background:var(--yellow);
      color:#302400;
    }

    button.red{
      background:var(--red);
    }

    .menuBtn{
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      gap:5px;
    }

    .menuBtn span{
      font-size:12px;
      font-weight:650;
      opacity:.88;
    }

    .navRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:auto;
    }

    .counter{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      font-weight:850;
    }

    .flashWrap{
      perspective:1000px;
      flex:1 1 auto;
      min-height:260px;
      display:flex;
    }

    .flashCard{
      width:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform .55s cubic-bezier(.2,.8,.2,1);
      cursor:pointer;
      min-height:260px;
    }

    .flashCard.flipped{
      transform:rotateY(180deg);
    }

    .face{
      position:absolute;
      inset:0;
      border-radius:26px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backface-visibility:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:22px;
      overflow:hidden;
    }

    .front{
      background:linear-gradient(180deg,#ffffff,#f7fafc);
    }

    .back{
      background:linear-gradient(180deg,var(--blueLight),#ffffff);
      transform:rotateY(180deg);
    }

    .faceLabel{
      position:absolute;
      top:14px;
      left:14px;
      font-size:12px;
      font-weight:950;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .categoryLabel{
      position:absolute;
      top:14px;
      right:14px;
      font-size:12px;
      font-weight:900;
      background:#eef2f6;
      color:var(--text);
      border-radius:999px;
      padding:5px 8px;
      max-width:48%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .faceText{
      font-size:27px;
      font-weight:950;
      line-height:1.12;
      letter-spacing:-.03em;
      max-width:100%;
    }

    .back .faceText{
      font-size:20px;
      font-weight:850;
    }

    .tapHint{
      position:absolute;
      bottom:14px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
    }

    .progressWrap{
      height:10px;
      background:#e6edf3;
      border-radius:999px;
      overflow:hidden;
    }

    .progress{
      height:100%;
      width:0%;
      background:var(--blue);
      transition:.25s;
    }

    #builderScreen{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      flex-direction:column;
      background:#dff0f6;
      padding:0;
      border:0;
      border-radius:0;
      box-shadow:none;
    }

    #builderScreen.active{
      display:flex;
    }

    .builderTop{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--border);
      overflow:auto;
    }

    .builderTop button{
      min-height:38px;
      padding:8px 11px;
      font-size:13px;
      border-radius:14px;
      white-space:nowrap;
    }

    .builderInfo{
      flex:1 0 auto;
      min-width:150px;
      font-size:12px;
      font-weight:850;
      color:var(--muted);
      white-space:nowrap;
    }

    .builderLayout{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns:122px 1fr;
      background:#dff0f6;
    }

    .palette{
      background:rgba(255,255,255,.95);
      border-right:1px solid var(--border);
      padding:8px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .paletteTitle{
      font-size:12px;
      font-weight:950;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
      margin:2px 0;
    }

    .palette button{
      min-height:38px;
      padding:8px;
      border-radius:14px;
      font-size:13px;
      text-align:left;
    }

    .canvasWrap{
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,#cfefff 0%,#e8f8e8 62%,#c9955b 62%,#bd8548 100%);
      touch-action:none;
    }

    #workArea{
      position:absolute;
      inset:0;
      overflow:hidden;
      touch-action:none;
    }

    #arrowLayer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:3;
    }

    .treeArt{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:260px;
      height:310px;
      z-index:1;
      pointer-events:none;
    }

    .sunArt{
      position:absolute;
      left:18px;
      top:16px;
      width:72px;
      height:72px;
      border-radius:50%;
      background:#ffd84a;
      box-shadow:0 0 0 12px rgba(255,216,74,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      font-weight:900;
      z-index:1;
      pointer-events:none;
    }

    .groundLabel{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(255,255,255,.9);
      border:1px solid var(--border);
      border-radius:999px;
      padding:6px 10px;
      font-size:13px;
      font-weight:950;
      z-index:1;
      pointer-events:none;
    }

    .node{
      position:absolute;
      z-index:5;
      min-width:76px;
      max-width:155px;
      padding:9px 11px;
      border-radius:999px;
      background:white;
      border:2px solid transparent;
      box-shadow:0 8px 18px rgba(20,32,51,.17);
      font-size:14px;
      font-weight:950;
      text-align:center;
      cursor:grab;
      user-select:none;
      touch-action:none;
    }

    .node.selected{
      border-color:var(--yellow);
      box-shadow:0 0 0 4px rgba(246,196,83,.35), 0 8px 18px rgba(20,32,51,.17);
    }

    .node.hasAudio::after{
      content:" 🔊";
    }

    .node.figure{
      font-size:28px;
      min-width:56px;
      max-width:70px;
      padding:8px;
    }

    .arrowHandle{
      position:absolute;
      width:22px;
      height:22px;
      margin-left:-11px;
      margin-top:-11px;
      border-radius:50%;
      background:white;
      border:3px solid var(--blue);
      z-index:7;
      touch-action:none;
      box-shadow:0 3px 10px rgba(20,32,51,.2);
    }

    .arrowHandle.end{
      border-color:var(--green);
    }

    .arrowHandle.selected{
      box-shadow:0 0 0 5px rgba(246,196,83,.35);
    }

    .statusBar{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      background:rgba(255,255,255,.95);
      border-top:1px solid var(--border);
      overflow:auto;
    }

    .statusText{
      flex:1 0 220px;
      font-size:12px;
      font-weight:850;
      color:var(--muted);
      white-space:nowrap;
    }

    .statusBar button{
      min-height:38px;
      padding:8px 10px;
      font-size:13px;
      border-radius:14px;
      white-space:nowrap;
    }

    @media(orientation:landscape){
      .app{
        max-width:100%;
      }

      .builderLayout{
        grid-template-columns:130px 1fr;
      }

      .treeArt{
        width:300px;
        height:350px;
      }
    }

    @media(max-width:420px) and (orientation:portrait){
      .builderLayout{
        grid-template-columns:1fr;
        grid-template-rows:1fr 116px;
      }

      .palette{
        grid-row:2;
        grid-column:1;
        border-right:0;
        border-top:1px solid var(--border);
        flex-direction:row;
        overflow:auto;
      }

      .paletteTitle{
        display:none;
      }

      .palette button{
        flex:0 0 auto;
        white-space:nowrap;
      }

      .canvasWrap{
        grid-row:1;
        grid-column:1;
      }

      .treeArt{
        width:220px;
        height:270px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="topline">
        <div class="badge">Fotosyntes</div>
        <div class="small" id="headerInfo">Start</div>
      </div>

      <h1>Viljas Fotosyntes</h1>
      <p class="small">Flashcards och bygg en egen bild.</p>
    </header>

    <main id="home" class="screen active">
      <h2>Välj träning</h2>

      <div class="menuGrid">
        <button class="menuBtn" onclick="startCategory('grunder')">
          Grunder
          <span>Vad fotosyntes är</span>
        </button>

        <button class="menuBtn" onclick="startCategory('behov')">
          Trädet behöver
          <span>Vatten, solljus, koldioxid</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('resultat')">
          Trädet tillverkar
          <span>Druvsocker och syre</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('begrepp')">
          Begrepp
          <span>Alla viktiga ord</span>
        </button>

        <button class="menuBtn yellow" onclick="openBuilder()">
          Bygg din bild
          <span>Stor rityta och ljud</span>
        </button>

        <button class="menuBtn yellow" onclick="startCategory('alla')">
          Alla kort
          <span>Allt blandat</span>
        </button>
      </div>
    </main>

    <section id="cards" class="screen">
      <h2 id="categoryTitle">Flashcards</h2>

      <div class="counter" id="counter">1 av 1</div>

      <div class="progressWrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="flashWrap">
        <div class="flashCard" id="flashCard" onclick="flipCard()">
          <div class="face front">
            <div class="faceLabel">Fråga</div>
            <div class="categoryLabel" id="frontCategory">Kategori</div>
            <div class="faceText" id="frontText"></div>
            <div class="tapHint">Tryck för att vända</div>
          </div>

          <div class="face back">
            <div class="faceLabel">Svar</div>
            <div class="categoryLabel" id="backCategory">Kategori</div>
            <div class="faceText" id="backText"></div>
            <div class="tapHint">Tryck för att vända tillbaka</div>
          </div>
        </div>
      </div>

      <div class="navRow">
        <button class="secondary" onclick="previousCard()">Föregående</button>
        <button onclick="nextCard()">Nästa kort</button>
      </div>

      <button class="secondary" onclick="openHome()">Till meny</button>
    </section>
  </div>

  <section id="builderScreen">
    <div class="builderTop">
      <button class="secondary" onclick="closeBuilder()">Till meny</button>
      <button onclick="addArrow()">Ny pil</button>
      <button class="green" onclick="saveBuilder()">Spara</button>
      <button class="secondary" onclick="loadBuilder()">Ladda</button>
      <button class="red" onclick="clearBuilder()">Rensa</button>
      <div class="builderInfo">Vänd mobilen för större arbetsyta. Tryck på rubrik för att spela ljud.</div>
    </div>

    <div class="builderLayout">
      <div class="palette">
        <div class="paletteTitle">Begrepp</div>
        <button onclick="addNode('Solljus')">Solljus</button>
        <button onclick="addNode('Vatten')">Vatten</button>
        <button onclick="addNode('Näring')">Näring</button>
        <button onclick="addNode('Koldioxid')">Koldioxid</button>
        <button onclick="addNode('Klorofyll')">Klorofyll</button>
        <button onclick="addNode('Druvsocker')">Druvsocker</button>
        <button onclick="addNode('Syre')">Syre</button>
        <button onclick="addNode('Växt')">Växt</button>
        <button onclick="addFigure('👧','Människa')">Människa</button>
        <button onclick="addFigure('🐇','Djur')">Djur</button>
      </div>

      <div class="canvasWrap">
        <div id="workArea">
          <svg id="arrowLayer">
            <defs>
              <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#156082"></path>
              </marker>
            </defs>
          </svg>

          <div class="sunArt">☀</div>

          <svg class="treeArt" viewBox="0 0 260 310">
            <ellipse cx="130" cy="95" rx="95" ry="70" fill="#2f9447"></ellipse>
            <circle cx="80" cy="85" r="52" fill="#2d8a41"></circle>
            <circle cx="130" cy="55" r="58" fill="#3ba653"></circle>
            <circle cx="178" cy="92" r="55" fill="#2d8a41"></circle>
            <circle cx="120" cy="120" r="62" fill="#3aa34f"></circle>
            <rect x="112" y="130" width="38" height="115" rx="14" fill="#8b5a2b"></rect>
            <path d="M130 225 C95 245 80 260 55 285" stroke="#8b5a2b" stroke-width="10" fill="none" stroke-linecap="round"></path>
            <path d="M130 225 C165 245 185 260 215 285" stroke="#8b5a2b" stroke-width="10" fill="none" stroke-linecap="round"></path>
            <path d="M130 225 C125 250 125 270 125 300" stroke="#8b5a2b" stroke-width="10" fill="none" stroke-linecap="round"></path>
          </svg>

          <div class="groundLabel">TRÄD</div>
        </div>
      </div>
    </div>

    <div class="statusBar">
      <div class="statusText" id="selectedInfo">Ingen rubrik vald</div>
      <button onclick="startRecording()">Spela in</button>
      <button class="secondary" onclick="stopRecording()">Stoppa</button>
      <button class="secondary" onclick="playSelectedAudio()">Spela upp</button>
      <button class="red" onclick="deleteSelectedAudio()">Radera ljud</button>
    </div>
  </section>

  <script>
    const categories = {
      grunder:{
        title:"Grunder",
        cards:[
          {
            q:"Vad är fotosyntes?",
            a:"En process i gröna växter och träd där vatten, solljus och koldioxid blir druvsocker och syre."
          },
          {
            q:"Var sker fotosyntesen?",
            a:"I gröna växter och träd, framför allt i bladen."
          },
          {
            q:"Varför är fotosyntesen viktig?",
            a:"Växter får energi och kan växa. Människor och djur får syre att andas."
          },
          {
            q:"Hur hjälper växter och människor varandra?",
            a:"Växter ger syre. Människor och djur andas ut koldioxid som växter behöver."
          }
        ]
      },

      behov:{
        title:"Trädet behöver",
        cards:[
          {
            q:"Vad behöver trädet för fotosyntesen?",
            a:"Vatten, solljus och koldioxid."
          },
          {
            q:"Hur får trädet vatten och näring?",
            a:"Genom rötterna från marken."
          },
          {
            q:"Vad gör klorofyll?",
            a:"Samlar in solljus i de gröna bladen."
          },
          {
            q:"Varifrån kommer koldioxid?",
            a:"Från luften. Människor och djur andas ut koldioxid."
          }
        ]
      },

      resultat:{
        title:"Trädet tillverkar",
        cards:[
          {
            q:"Vad tillverkar trädet i fotosyntesen?",
            a:"Druvsocker och syre."
          },
          {
            q:"Vad är druvsocker?",
            a:"Trädets mat och energi. Det hjälper trädet att växa."
          },
          {
            q:"Vad gör trädet med syret?",
            a:"Släpper ut det i luften."
          },
          {
            q:"Varför är syre viktigt?",
            a:"Människor och djur behöver syre för att andas och leva."
          }
        ]
      },

      begrepp:{
        title:"Begrepp",
        cards:[
          {
            q:"Solljus",
            a:"Energi från solen som klorofyllet samlar in."
          },
          {
            q:"Vatten",
            a:"Tas upp från marken med rötterna."
          },
          {
            q:"Koldioxid",
            a:"Gas i luften som människor och djur andas ut. Trädet behöver den."
          },
          {
            q:"Syre",
            a:"Gas som trädet släpper ut. Människor och djur behöver den."
          },
          {
            q:"Druvsocker",
            a:"Trädets mat och energi."
          },
          {
            q:"Näring",
            a:"Tas upp från marken med rötterna och hjälper växten att växa."
          },
          {
            q:"Klorofyll",
            a:"Bladgrönt som samlar in solljus i bladen."
          },
          {
            q:"Växter",
            a:"Behöver vatten, solljus och koldioxid. Ger syre och druvsocker."
          },
          {
            q:"Människor och djur",
            a:"Andas in syre och andas ut koldioxid."
          }
        ]
      }
    };

    let activeCards = [];
    let activeTitle = "";
    let currentIndex = 0;

    function openHome(){
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('home').classList.add('active');
      document.getElementById('headerInfo').textContent = 'Start';
    }

    function startCategory(key){
      if(key === 'alla'){
        activeCards = [];

        Object.keys(categories).forEach(categoryKey => {
          categories[categoryKey].cards.forEach(card => {
            activeCards.push({
              q:card.q,
              a:card.a,
              category:categories[categoryKey].title
            });
          });
        });

        activeTitle = "Alla kort";
      }else{
        activeCards = categories[key].cards.map(card => {
          return {
            q:card.q,
            a:card.a,
            category:categories[key].title
          };
        });

        activeTitle = categories[key].title;
      }

      currentIndex = 0;

      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('cards').classList.add('active');
      document.getElementById('headerInfo').textContent = activeTitle;
      document.getElementById('categoryTitle').textContent = activeTitle;

      renderCard();
    }

    function renderCard(){
      const card = activeCards[currentIndex];
      const progress = Math.round(((currentIndex + 1) / activeCards.length) * 100);

      document.getElementById('frontText').textContent = card.q;
      document.getElementById('backText').textContent = card.a;
      document.getElementById('frontCategory').textContent = card.category;
      document.getElementById('backCategory').textContent = card.category;
      document.getElementById('counter').textContent = (currentIndex + 1) + ' av ' + activeCards.length;
      document.getElementById('progress').style.width = progress + '%';
      document.getElementById('flashCard').classList.remove('flipped');
    }

    function flipCard(){
      document.getElementById('flashCard').classList.toggle('flipped');
    }

    function nextCard(){
      currentIndex = (currentIndex + 1) % activeCards.length;
      renderCard();
    }

    function previousCard(){
      currentIndex = (currentIndex - 1 + activeCards.length) % activeCards.length;
      renderCard();
    }

    let nodes = [];
    let arrows = [];
    let selectedNodeId = null;
    let selectedArrowId = null;
    let idCounter = 1;
    let mediaRecorder = null;
    let audioChunks = [];
    let db = null;

    function openBuilder(){
      document.getElementById('builderScreen').classList.add('active');
      initDb();
      loadBuilder();
    }

    function closeBuilder(){
      document.getElementById('builderScreen').classList.remove('active');
    }

    function workRect(){
      return document.getElementById('workArea').getBoundingClientRect();
    }

    function addNode(text){
      const rect = workRect();

      const node = {
        id:"n" + idCounter++,
        text:text,
        type:"word",
        x:Math.max(20, rect.width * 0.44),
        y:Math.max(20, rect.height * 0.42)
      };

      nodes.push(node);
      renderBuilder();
      selectNode(node.id);
      saveBuilder();
    }

    function addFigure(symbol, label){
      const rect = workRect();

      const node = {
        id:"n" + idCounter++,
        text:symbol,
        label:label,
        type:"figure",
        x:Math.max(20, rect.width * 0.68),
        y:Math.max(20, rect.height * 0.55)
      };

      nodes.push(node);
      renderBuilder();
      selectNode(node.id);
      saveBuilder();
    }

    function addArrow(){
      const rect = workRect();

      const arrow = {
        id:"a" + idCounter++,
        x1:rect.width * 0.22,
        y1:rect.height * 0.28,
        x2:rect.width * 0.48,
        y2:rect.height * 0.36
      };

      arrows.push(arrow);
      renderBuilder();
      selectArrow(arrow.id);
      saveBuilder();
    }

    function renderBuilder(){
      const area = document.getElementById('workArea');

      area.querySelectorAll('.node,.arrowHandle').forEach(el => el.remove());
      renderArrows();

      nodes.forEach(node => {
        const el = document.createElement('div');
        el.className = node.type === "figure" ? "node figure" : "node";
        el.textContent = node.text;
        el.style.left = node.x + "px";
        el.style.top = node.y + "px";
        el.dataset.id = node.id;

        if(node.id === selectedNodeId){
          el.classList.add('selected');
        }

        hasAudio(node.id).then(exists => {
          if(exists){
            el.classList.add('hasAudio');
          }
        });

        el.addEventListener('pointerdown', e => startDragNode(e, node.id));
        el.addEventListener('click', e => {
          e.stopPropagation();
          selectNode(node.id);
          playAudio(node.id);
        });

        area.appendChild(el);
      });

      arrows.forEach(arrow => {
        createHandle(arrow, "start");
        createHandle(arrow, "end");
      });
    }

    function renderArrows(){
      const svg = document.getElementById('arrowLayer');

      Array.from(svg.querySelectorAll('line')).forEach(line => line.remove());

      arrows.forEach(arrow => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", arrow.x1);
        line.setAttribute("y1", arrow.y1);
        line.setAttribute("x2", arrow.x2);
        line.setAttribute("y2", arrow.y2);
        line.setAttribute("stroke", "#156082");
        line.setAttribute("stroke-width", arrow.id === selectedArrowId ? "6" : "4");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("marker-end", "url(#arrowHead)");
        svg.appendChild(line);
      });
    }

    function createHandle(arrow, end){
      const area = document.getElementById('workArea');
      const handle = document.createElement('div');

      handle.className = end === "end" ? "arrowHandle end" : "arrowHandle";
      handle.style.left = (end === "end" ? arrow.x2 : arrow.x1) + "px";
      handle.style.top = (end === "end" ? arrow.y2 : arrow.y1) + "px";

      if(arrow.id === selectedArrowId){
        handle.classList.add('selected');
      }

      handle.addEventListener('pointerdown', e => startDragArrowHandle(e, arrow.id, end));
      handle.addEventListener('click', e => {
        e.stopPropagation();
        selectArrow(arrow.id);
      });

      area.appendChild(handle);
    }

    function selectNode(id){
      selectedNodeId = id;
      selectedArrowId = null;

      const node = nodes.find(n => n.id === id);
      const name = node ? (node.label || node.text) : "Ingen rubrik vald";
      document.getElementById('selectedInfo').textContent = "Vald: " + name;

      renderBuilder();
    }

    function selectArrow(id){
      selectedArrowId = id;
      selectedNodeId = null;
      document.getElementById('selectedInfo').textContent = "Pil vald. Dra start eller slutpunkt.";
      renderBuilder();
    }

    function startDragNode(e, id){
      e.stopPropagation();
      selectNode(id);

      const node = nodes.find(n => n.id === id);
      const rect = workRect();

      const startX = e.clientX;
      const startY = e.clientY;
      const originX = node.x;
      const originY = node.y;

      const move = ev => {
        node.x = clamp(originX + ev.clientX - startX, 0, rect.width - 70);
        node.y = clamp(originY + ev.clientY - startY, 0, rect.height - 40);
        renderBuilder();
      };

      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        saveBuilder();
      };

      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    function startDragArrowHandle(e, id, end){
      e.stopPropagation();
      selectArrow(id);

      const arrow = arrows.find(a => a.id === id);
      const rect = workRect();

      const move = ev => {
        const localX = clamp(ev.clientX - rect.left, 0, rect.width);
        const localY = clamp(ev.clientY - rect.top, 0, rect.height);

        if(end === "end"){
          arrow.x2 = localX;
          arrow.y2 = localY;
        }else{
          arrow.x1 = localX;
          arrow.y1 = localY;
        }

        renderBuilder();
      };

      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        saveBuilder();
      };

      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    function clamp(value, min, max){
      return Math.max(min, Math.min(max, value));
    }

    function saveBuilder(){
      const data = {
        nodes:nodes,
        arrows:arrows,
        idCounter:idCounter
      };

      localStorage.setItem("viljaFotosyntesBuilder", JSON.stringify(data));
      document.getElementById('selectedInfo').textContent = "Sparat lokalt på denna enhet.";
    }

    function loadBuilder(){
      const saved = localStorage.getItem("viljaFotosyntesBuilder");

      if(!saved){
        renderBuilder();
        return;
      }

      try{
        const data = JSON.parse(saved);
        nodes = data.nodes || [];
        arrows = data.arrows || [];
        idCounter = data.idCounter || 1;
        selectedNodeId = null;
        selectedArrowId = null;
        renderBuilder();
      }catch(e){
        renderBuilder();
      }
    }

    function clearBuilder(){
      if(!confirm("Rensa bilden? Ljudklipp sparas men rubriker och pilar tas bort.")){
        return;
      }

      nodes = [];
      arrows = [];
      selectedNodeId = null;
      selectedArrowId = null;
      saveBuilder();
      renderBuilder();
      document.getElementById('selectedInfo').textContent = "Rensat.";
    }

    window.addEventListener('resize', () => {
      if(document.getElementById('builderScreen').classList.contains('active')){
        renderBuilder();
      }
    });

    function initDb(){
      if(db) return;

      const request = indexedDB.open("ViljaFotosyntesAudio", 1);

      request.onupgradeneeded = event => {
        const database = event.target.result;
        if(!database.objectStoreNames.contains("audio")){
          database.createObjectStore("audio");
        }
      };

      request.onsuccess = event => {
        db = event.target.result;
        renderBuilder();
      };

      request.onerror = () => {
        document.getElementById('selectedInfo').textContent = "Kunde inte öppna ljudlagring.";
      };
    }

    async function startRecording(){
      if(!selectedNodeId){
        document.getElementById('selectedInfo').textContent = "Välj en rubrik först.";
        return;
      }

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        document.getElementById('selectedInfo').textContent = "Mikrofon stöds inte här. Öppna via HTTPS i Safari eller Chrome.";
        return;
      }

      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          if(event.data.size > 0){
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, {type:"audio/webm"});
          await saveAudio(selectedNodeId, blob);
          stream.getTracks().forEach(track => track.stop());
          document.getElementById('selectedInfo').textContent = "Ljud sparat på vald rubrik.";
          renderBuilder();
        };

        mediaRecorder.start();
        document.getElementById('selectedInfo').textContent = "Spelar in. Tryck Stoppa när du är klar.";
      }catch(e){
        document.getElementById('selectedInfo').textContent = "Mikrofon nekad eller fungerar inte i denna vy.";
      }
    }

    function stopRecording(){
      if(mediaRecorder && mediaRecorder.state === "recording"){
        mediaRecorder.stop();
      }
    }

    function saveAudio(id, blob){
      return new Promise(resolve => {
        if(!db){
          resolve();
          return;
        }

        const tx = db.transaction("audio", "readwrite");
        tx.objectStore("audio").put(blob, id);
        tx.oncomplete = resolve;
      });
    }

    function getAudio(id){
      return new Promise(resolve => {
        if(!db){
          resolve(null);
          return;
        }

        const tx = db.transaction("audio", "readonly");
        const request = tx.objectStore("audio").get(id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      });
    }

    function hasAudio(id){
      return getAudio(id).then(blob => !!blob);
    }

    async function playAudio(id){
      if(!id) return;

      const blob = await getAudio(id);

      if(!blob){
        return;
      }

      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);

      audio.onended = () => URL.revokeObjectURL(url);
      audio.play();
    }

    function playSelectedAudio(){
      if(!selectedNodeId){
        document.getElementById('selectedInfo').textContent = "Välj en rubrik först.";
        return;
      }

      playAudio(selectedNodeId);
    }

    function deleteSelectedAudio(){
      if(!selectedNodeId){
        document.getElementById('selectedInfo').textContent = "Välj en rubrik först.";
        return;
      }

      if(!db){
        return;
      }

      const tx = db.transaction("audio", "readwrite");
      tx.objectStore("audio").delete(selectedNodeId);
      tx.oncomplete = () => {
        document.getElementById('selectedInfo').textContent = "Ljud raderat.";
        renderBuilder();
      };
    }
  </script>
</body>
</html>
