name: Build Philippines family travel film
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-travel-film.yml"
      - "resa/film/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install film dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --disable-pip-version-check pillow requests
      - name: Render two-minute film with ElevenLabs narration
        env:
          VOICE_URL: 'https://elevenlabsusercontent.com/database/workspace/2b4562f7b9644c1d8d0e99590f0f7631/content_generation/k0IO6F4vBQDZcMtCy511/MxugJEVCCpsMA9CRxZvk/content.mp3?Expires=1794780000&KeyName=assets-cdn-key-1&Signature=UepevC0OtI8MNW3l4hUlmd-JtiE='
        run: |
          python resa/film/build.py
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 resa/film/filippinerna-2027.mp4
      - name: Publish movie and photo credits to GitHub Pages
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add resa/film/filippinerna-2027.mp4 resa/film/BILDKALLOR.md resa/film/bildkallor.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Philippines travel movie with Swedish ElevenLabs voiceover"
            git push origin main
          fi
